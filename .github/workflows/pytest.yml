name: Pytest

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4  # Update to latest version

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Update to latest version
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        pip install -e .  # Install your package in editable mode

    - name: Test with pytest
      run: |
        pytest -v  # Added verbose flag for more detailed output
